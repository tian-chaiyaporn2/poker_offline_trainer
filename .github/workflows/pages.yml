name: Deploy Pages (self-contained trainer only)

# The trainer is a single self-contained index.html (fonts/packs/SVG all inlined), so the
# published site needs ONLY that file — not the 60+ MB of solver source, tests, notebooks and
# signed .db packs in the repo. The default "Deploy from a branch" builder shipped the whole
# repo, which crept up to GitHub's ~10-min Pages build limit and started timing out / wedging
# deployments. This workflow stages just index.html (+ the demo copy) into a small artifact (a few MB),
# so builds finish in seconds, and `cancel-in-progress` clears any stuck deployment.
#
# Requires repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel a stuck/older one instead of queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Stage the self-contained site
        run: |
          mkdir -p _site/demo
          cp index.html _site/index.html
          cp demo/trainer_demo.html _site/demo/trainer_demo.html 2>/dev/null || true
          # the trainer footer links this content gallery — deploy it so the link works
          cp preview.html _site/preview.html 2>/dev/null || true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
